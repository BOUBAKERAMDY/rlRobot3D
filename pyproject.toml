[project]
name = "rescue-dog"
version = "0.1.0"
description = "Apprentissage par renforcement robuste pour un robot quadrupède (chien de sauvetage)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playground",
    # brax 0.14.2 utilise jax.device_put_replicated, supprimé dans jax 0.10
    "jax<0.10",
    "pyyaml",
    "imageio-ffmpeg>=0.6.0",
    "mediapy>=1.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_dog"]
